<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f5f7fa" />
  <title>Action Camera Catch</title>
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <header class="app-header">
    <div>
      <h1>🪣 Action Camera Catch</h1>
      <p class="muted">由伺服器將雲端素材拉回 NAS；關閉瀏覽器不會停止下載。</p>
    </div>
    <div class="header-actions">
      <button id="refresh-btn">重新整理</button>
      <button id="sync-all-btn" class="primary">同步全部</button>
    </div>
  </header>

  <main class="workspace">
    <section class="panel containers-panel" aria-labelledby="containers-title">
      <div class="panel-header">
        <div>
          <h2 id="containers-title">Blob Entries</h2>
          <span id="containers-summary" class="muted">載入中…</span>
        </div>
      </div>
      <div id="containers-list" class="container-list" aria-live="polite"></div>
    </section>

    <div id="right-workspace" class="right-workspace">
      <section id="blobs-panel" class="panel blobs-panel" aria-labelledby="blobs-title" hidden>
        <div class="panel-header">
          <div>
            <h2 id="blobs-title">Blob Entries Details</h2>
            <span id="blobs-summary" class="muted">請先選擇左側 container</span>
          </div>
        </div>
        <div class="panel-content table-scroll">
          <div id="blobs-empty" class="empty-state">
            選擇一個 container 以查看遠端檔案與 NAS 狀態。
          </div>
          <table id="blobs-table" hidden>
            <thead>
              <tr><th>狀態</th><th>名稱</th><th>大小</th><th>備註</th></tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

      <section class="panel jobs-panel" aria-labelledby="jobs-title">
        <div class="panel-header">
          <div>
            <h2 id="jobs-title">Download Log and Status</h2>
            <span id="jobs-summary" class="muted">伺服器背景工作</span>
          </div>
          <div class="panel-actions">
            <button id="clear-jobs-btn" disabled>清除已完成</button>
            <button id="refresh-jobs-btn">重新整理</button>
          </div>
        </div>
        <div id="jobs-list" class="jobs-list" aria-live="polite"></div>
      </section>
    </div>
  </main>

  <script src="/app.js"></script>
</body>
</html>
